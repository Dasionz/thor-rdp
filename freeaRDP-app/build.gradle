apply plugin: 'com.android.application'

android {
    compileSdkVersion compileApi
    // Optional portable NDK, used only to strip prebuilt native debug symbols.
    if (System.getenv('THOR_ANDROID_NDK')) {
        ndkPath System.getenv('THOR_ANDROID_NDK')
        def thorNdkProperties = new Properties()
        file("${System.getenv('THOR_ANDROID_NDK')}/source.properties").withInputStream {
            thorNdkProperties.load(it)
        }
        ndkVersion thorNdkProperties.getProperty('Pkg.Revision')
    }

    defaultConfig {
        applicationId 'dev.thor.freerdp'
        versionCode 2
        versionName '0.1.1-thor'
        targetSdkVersion targetApi
        minSdkVersion project.getProperties().get("SDK_VERSION")
        multiDexEnabled true
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    packaging {
        jniLibs {
            // This distribution only uses RDP; omit the unrelated SPICE engines.
            excludes += ['**/libspice.so', '**/libgstreamer_android.so']
        }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.iiordanov.freeaRDP'
    lint {
        disable 'Instantiatable'
    }
}

dependencies {
    api 'com.android.support:multidex:1.0.3'
    implementation project(':bVNC')
    implementation project(':pubkeyGenerator')
    // Legacy platform runner is test-only; Android 36 keeps its compile stubs
    // in optional jars instead of android.jar.
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${compileApi}/optional/android.test.runner.jar")
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${compileApi}/optional/android.test.base.jar")
    androidTestImplementation(name: 'android-database-sqlcipher-4.5.4', ext: 'aar')
    // These implementation dependencies are not exported by bVNC's API surface.
    androidTestImplementation project(':remoteClientLib')
    androidTestImplementation project(':common')
    androidTestImplementation 'androidx.sqlite:sqlite:2.2.0'
}
